<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RODRI EDUCA 4.0 · Tu espacio de apoyo educativo</title>
<style>
:root{--blue:#3478d4;--blue-dark:#225cae;--ink:#17243a;--muted:#68778d;--line:#e3eaf3;--bg:#f3f7fc;--card:#fff;--green:#16865b;--red:#c34444;--soft:#eaf2ff;--shadow:0 8px 24px rgba(30,62,105,.06)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 Inter,"Segoe UI",Roboto,Arial,sans-serif;letter-spacing:.08px}
.app{display:grid;grid-template-columns:252px 1fr;min-height:100vh}.side{background:#fff;border-right:1px solid var(--line);padding:27px 17px;position:sticky;top:0;height:100vh}.brand{font-size:23px;font-weight:850;letter-spacing:-.8px;color:var(--blue)}.sub{color:var(--muted);font-size:12px;margin:3px 0 27px;letter-spacing:.2px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;text-align:left;padding:11px 13px;border-radius:11px;color:#536176;font:600 13px/1.4 Inter,"Segoe UI",sans-serif;cursor:pointer;transition:.18s}.nav button.active,.nav button:hover{background:#eaf2ff;color:#1d5eb2}.sidefoot{position:absolute;bottom:18px;left:18px;right:18px;color:var(--muted);font-size:11px}.main{padding:34px;max-width:1480px;width:100%;margin:auto}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:25px}.top h1{margin:0;font-size:28px;line-height:1.2;letter-spacing:-.8px;font-weight:800}.top p{margin:6px 0 0;color:var(--muted);font-size:14px}.top-actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.pill{background:#e8f7ef;color:#14784e;border-radius:99px;padding:7px 11px;font-size:12px;font-weight:750;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow)}.metric{font-size:30px;font-weight:800;letter-spacing:-.8px;margin-top:8px}.muted{color:var(--muted)}.small{font-size:12px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:13px;font-weight:700;color:#43536b}input,select,textarea{width:100%;padding:11px 12px;border:1px solid #d7e0eb;border-radius:11px;background:#fff;color:var(--ink);font:14px/1.5 Inter,"Segoe UI",sans-serif}input:focus,select:focus,textarea:focus{outline:3px solid #dceaff;border-color:#8bb5ef}textarea{min-height:86px;resize:vertical}button,.btn{border:0;border-radius:11px;padding:10px 14px;background:var(--blue);color:white;font:700 13px/1.4 Inter,"Segoe UI",sans-serif;cursor:pointer;transition:background .18s,transform .18s}button:hover,.btn:hover{background:var(--blue-dark)}button:active{transform:translateY(1px)}button.secondary{background:#edf2f8;color:#34445b}button.secondary:hover{background:#e1eaf5}button.danger{background:#fff0f0;color:#a52e2e}button:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:15px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--muted);font-weight:750}.tag{display:inline-block;background:#eef4fc;color:#315e97;border-radius:99px;padding:4px 9px;font-size:11px;font-weight:700}.empty{padding:26px;text-align:center;color:var(--muted);background:#f8fafd;border:1px dashed #dce5f0;border-radius:12px}.section-title{font-size:18px;line-height:1.35;font-weight:800;letter-spacing:-.35px;margin:0 0 14px}.list{display:grid;gap:9px}.item{border:1px solid var(--line);border-radius:13px;padding:13px;display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fff}.score{font-size:20px;font-weight:800}.good{color:var(--green)}.bad{color:var(--red)}.hidden{display:none!important}.checkline{display:flex;align-items:center;gap:8px;margin:8px 0}.checkline input{width:auto}.qbox{background:#f7f9fc;padding:15px;border:1px solid #e9eef5;border-radius:12px;margin:11px 0}.notice{background:#fff8e8;border:1px solid #f4dfaa;padding:13px;border-radius:12px;color:#73551c;font-size:12px;margin:15px 0}.student-hero{background:linear-gradient(120deg,#eaf2ff,#f7faff);border:1px solid #dce9fb;border-radius:18px;padding:22px;margin-bottom:17px}.student-hero h2{margin:0 0 5px;font-size:22px;letter-spacing:-.5px}.student-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.student-tile{background:#fff;border:1px solid var(--line);border-radius:15px;padding:16px}.student-tile h3{font-size:15px;margin:0 0 6px}.student-mode{--bg:#f5f8fd}

/* Paneles visuales e ilustraciones suaves */
.visual-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;margin:16px 0}
.visual-card{background:linear-gradient(145deg,#fff,#f8fbff);border:1px solid var(--line);border-radius:18px;padding:19px;box-shadow:var(--shadow);min-width:0}
.visual-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:15px}
.visual-head h2{font-size:16px;margin:0;font-weight:800;letter-spacing:-.3px}
.illustration{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;background:#eaf2ff;color:#2868bd;font-size:23px;flex:none}
.illustration.mint{background:#e8f7f1;color:#16865b}.illustration.lilac{background:#f1edff;color:#7661bd}.illustration.peach{background:#fff1e8;color:#c47742}
.donut-row{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.donut{--pct:0;width:112px;height:112px;border-radius:50%;background:conic-gradient(var(--blue) var(--pct)%,#e8eef6 0);display:grid;place-items:center;position:relative;flex:none}
.donut:before{content:"";position:absolute;inset:11px;background:#fff;border-radius:50%}
.donut strong{position:relative;font-size:23px;letter-spacing:-.8px}.donut small{display:block;font-size:10px;color:var(--muted);font-weight:650;letter-spacing:0;text-align:center}
.legend{display:grid;gap:8px;min-width:120px;flex:1}.legend-line{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--blue);margin-right:7px}.dot.gray{background:#dce5f0}.dot.green{background:#35a77b}
.progress-list{display:grid;gap:14px}.progress-top{display:flex;justify-content:space-between;gap:10px;font-size:12px;margin-bottom:6px}.progress-track{height:9px;background:#edf2f8;border-radius:99px;overflow:hidden}.progress-fill{height:100%;width:var(--w);background:linear-gradient(90deg,#3478d4,#77a9ed);border-radius:99px}.progress-fill.green{background:linear-gradient(90deg,#26966b,#70c7a1)}
.spark-bars{display:flex;align-items:end;gap:7px;height:88px;padding:5px 2px 0}.spark-bars span{flex:1;min-width:9px;height:var(--h);border-radius:7px 7px 3px 3px;background:linear-gradient(180deg,#8db8ef,#3478d4)}
.visual-note{font-size:11px;color:var(--muted);margin-top:12px}
.student-welcome-art{display:flex;align-items:center;gap:15px}.student-welcome-art .big-illustration{width:76px;height:76px;border-radius:24px;background:#dceaff;display:grid;place-items:center;font-size:38px;flex:none}
.metric-icon{display:flex;align-items:center;justify-content:space-between;gap:8px}.metric-icon .illustration{width:38px;height:38px;font-size:19px;border-radius:13px}
@media(max-width:700px){.visual-grid{grid-template-columns:1fr}.donut{width:96px;height:96px}.student-welcome-art .big-illustration{width:60px;height:60px;font-size:30px}}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{height:auto;position:relative;padding:15px}.brand{font-size:20px}.sub{margin-bottom:12px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap;padding:9px}.sidefoot{display:none}.main{padding:20px}.grid{grid-template-columns:repeat(2,1fr)}.two,.three{grid-template-columns:1fr}.student-grid{grid-template-columns:1fr 1fr}.top h1{font-size:23px}}
@media(max-width:520px){.grid,.student-grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.top-actions{width:100%}.top-actions button{flex:1}}
@media print{.side,.top .pill,.top-actions,.no-print,button{display:none!important}.app{display:block}.main{padding:0}.card{box-shadow:none;break-inside:avoid}body{background:white}}

/* RODRI EDUCA 4.0 · identidad y navegación superior aprobadas */
.welcome-banner{display:flex;align-items:center;justify-content:space-between;gap:18px;background:linear-gradient(115deg,#eaf2ff 0%,#f7faff 72%,#f1efff 100%);border:1px solid #dce8fa;border-radius:21px;padding:23px 26px;margin-bottom:17px}.welcome-banner h2{margin:5px 0 4px;font-size:22px;letter-spacing:-.55px}.welcome-banner p{margin:0;color:#60718a;font-size:13px;max-width:680px}.welcome-kicker{font-size:10px;letter-spacing:1.1px;font-weight:850;color:#4776b4}.welcome-symbol{width:58px;height:58px;border-radius:19px;display:grid;place-items:center;background:#fff;color:#3978cb;font-size:30px;box-shadow:0 5px 18px rgba(44,96,165,.09);flex:none}@media(max-width:520px){.welcome-banner{padding:19px}.welcome-banner h2{font-size:19px}.welcome-symbol{width:45px;height:45px}}

:root{--blue:#2869bd;--blue-dark:#1e559d;--soft:#edf4ff;--shadow:0 8px 28px rgba(35,75,130,.055)}
.app{display:block;min-height:100vh}
.site-header{background:rgba(255,255,255,.96);border-bottom:1px solid var(--line);padding:17px clamp(16px,4vw,58px) 0;position:sticky;top:0;z-index:20;backdrop-filter:blur(12px)}
.brand-row{max-width:1480px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:18px;padding-bottom:13px}
.brand-lockup{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.brand{font-size:23px;font-weight:850;letter-spacing:-.8px;color:var(--blue)}
.version-mark{font-size:11px;font-weight:800;letter-spacing:.3px;color:#526b8d;background:#edf3fb;border-radius:7px;padding:3px 7px}
.sub{width:100%;margin:-5px 0 0;font-size:11px;letter-spacing:.1px}
.header-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.status-pill{display:inline-flex;align-items:center;gap:7px;background:#f0f6ff;color:#45658d;border:1px solid #e0eafa;border-radius:99px;padding:7px 11px;font-size:11px;font-weight:750;white-space:nowrap}.status-dot{width:7px;height:7px;border-radius:50%;background:#d49a37}
.nav{max-width:1480px;margin:0 auto;display:flex;gap:5px;overflow-x:auto;scrollbar-width:thin;padding:0 0 10px;white-space:nowrap}
.nav button{flex:none;border:0;background:transparent;text-align:center;padding:10px 13px;border-radius:11px;color:#617087;font:650 12px/1.4 Inter,"Segoe UI",sans-serif;cursor:pointer;transition:.18s}
.nav button.active,.nav button:hover{background:#eaf2ff;color:#1d5eb2}
.main{padding:30px clamp(16px,4vw,58px);max-width:1600px;width:100%;margin:0 auto}
.top{margin-bottom:22px}.top h1{font-size:27px}.card,.visual-card,.student-tile{border-radius:18px}
button,.btn{border-radius:12px}.illustration{border-radius:15px}
@media(max-width:700px){.site-header{padding:13px 14px 0;position:relative}.brand-row{align-items:flex-start;flex-direction:column;gap:10px}.header-tools{width:100%;justify-content:space-between}.brand{font-size:21px}.nav{gap:3px}.nav button{padding:9px 11px}.main{padding:21px 14px}.top h1{font-size:24px}}
@media print{.site-header{display:none!important}}


/* Ajuste final de marca e iconografía redondeada */
.brand-lockup{display:flex;align-items:center;gap:12px;flex-wrap:nowrap}
.brand-logo{display:block;width:min(330px,48vw);height:58px;object-fit:contain;object-position:left center}
.version-mark{border-radius:999px;padding:5px 10px;background:#edf4ff;color:#2869bd}
.brand-sparkle{width:30px;height:30px;display:grid;place-items:center;border-radius:50%;background:#edf4ff;color:#3478d4;font-size:16px;box-shadow:inset 0 0 0 1px #deebff}
.nav{align-items:center;gap:8px}
.nav button{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:8px 14px;background:#f7f9fd;color:#586b85}
.nav-icon{width:29px;height:29px;display:inline-grid;place-items:center;border-radius:50%;background:#e8f1ff;color:#2869bd;font-size:15px;line-height:1;flex:none;box-shadow:inset 0 0 0 1px #dce9fb}
.nav button.active{background:#eaf2ff;color:#1d5eb2}
.nav button.active .nav-icon,.nav button:hover .nav-icon{background:#2869bd;color:#fff;box-shadow:none}
.illustration,.metric-icon .illustration,.welcome-symbol,.student-welcome-art .big-illustration{border-radius:50%}
.illustration{box-shadow:inset 0 0 0 1px rgba(40,105,189,.06)}
@media(max-width:700px){.brand-lockup{gap:8px}.brand-logo{width:min(220px,68vw);height:48px}.brand-sparkle{width:26px;height:26px}.nav{gap:6px}.nav button{border-radius:999px;padding:7px 10px}.nav-icon{width:26px;height:26px}}

function render(){const titles={home:['Inicio','Resumen de tus aulas y actividad educativa.'],classrooms:['Mis aulas','Organiza los cursos y consulta sus espacios de trabajo.'],tasks:['Tareas y entregas','Asigna tareas y registra su estado de seguimiento.'],library:['Biblioteca','Guarda recursos y enlaces para tus clases.'],students:['Alumnos','Fichas individuales y organización de estudiantes.'],grades:['Calificaciones','Registra notas y consulta el historial.'],activities:['Actividades y exámenes','Crea cuestionarios de opción múltiple y corrígelos.'],groups:['Grupos','Organiza tus aulas en grupos de trabajo.'],calendar:['Calendario','Planifica clases, pruebas y actividades.'],reports:['Informes','Consulta medias y prepara informes imprimibles.'],settings:['Datos y ajustes','Exporta una copia de seguridad o restaura tus datos.']};const v=$('#view');if(mode==='student'){document.body.classList.add('student-mode');$('#pageTitle').textContent='Mi espacio de aprendizaje';$('#pageDesc').textContent='Consulta tus tareas, actividades y materiales.';v.innerHTML=studentPage();wireStudent()}else{document.body.classList.remove('student-mode');$('#pageTitle').textContent=titles[page][0];$('#pageDesc').textContent=titles[page][1];v.innerHTML=({home:homePage,classrooms:classroomsPage,tasks:tasksPage,library:libraryPage,students:studentsPage,grades:gradesPage,activities:activitiesPage,groups:groupsPage,calendar:calendarPage,reports:reportsPage,settings:settingsPage})[page]();wire()}$('#modeToggle').textContent=mode==='teacher'?'🎒 Vista del alumnado':'🧑‍🏫 Volver a profesor'}
function homePage(){let avg=data.grades.length?(data.grades.reduce((a,g)=>a+g.mark,0)/data.grades.length):0;let passed=data.grades.filter(g=>g.mark>=5).length;let passPct=data.grades.length?Math.round(passed/data.grades.length*100):0;let submitted=data.studentSubmissions.length;let totalTasks=data.tasks.length*Math.max(1,data.students.length);let taskPct=totalTasks?Math.min(100,Math.round(submitted/totalTasks*100)):0;return `<section class="welcome-banner"><div><span class="welcome-kicker">TU PANEL EDUCATIVO</span><h2>¡Bienvenido a RODRI EDUCA 4.0!</h2><p>Todo lo que necesitas para organizar tus aulas, acompañar el aprendizaje y seguir cada progreso.</p></div><div class="welcome-symbol">✦</div></section><div class="grid"><div class="card"><div class="metric-icon"><div><div class="muted small">Alumnos</div><div class="metric">${data.students.length}</div><div class="muted small">En tus aulas</div></div><span class="illustration">♙</span></div></div><div class="card"><div class="metric-icon"><div><div class="muted small">Calificaciones</div><div class="metric">${data.grades.length}</div><div class="muted small">Notas registradas</div></div><span class="illustration mint">✎</span></div></div><div class="card"><div class="metric-icon"><div><div class="muted small">Actividades</div><div class="metric">${data.activities.length}</div><div class="muted small">Cuestionarios creados</div></div><span class="illustration lilac">✧</span></div></div><div class="card"><div class="metric-icon"><div><div class="muted small">Media general</div><div class="metric">${data.grades.length?avg.toFixed(1):'—'}</div><div class="muted small">Sobre 10</div></div><span class="illustration peach">★</span></div></div></div><div class="visual-grid"><section class="visual-card"><div class="visual-head"><h2>Panorama de calificaciones</h2><span class="illustration mint">◉</span></div><div class="donut-row"><div class="donut" style="--pct:${passPct}"><div><strong>${data.grades.length?passPct+'%':'—'}</strong><small>aprobados</small></div></div><div class="legend"><div class="legend-line"><span><i class="dot green"></i>5 o más</span><b>${passed}</b></div><div class="legend-line"><span><i class="dot gray"></i>Menos de 5</span><b>${data.grades.length-passed}</b></div><div class="legend-line"><span>Total de notas</span><b>${data.grades.length}</b></div></div></div><div class="visual-note">El gráfico se actualiza al registrar nuevas calificaciones.</div></section><section class="visual-card"><div class="visual-head"><h2>Seguimiento de tareas</h2><span class="illustration lilac">✓</span></div><div class="donut-row"><div class="donut" style="--pct:${taskPct}"><div><strong>${totalTasks?taskPct+'%':'—'}</strong><small>entregadas</small></div></div><div class="legend"><div class="legend-line"><span><i class="dot green"></i>Entregas</span><b>${submitted}</b></div><div class="legend-line"><span><i class="dot gray"></i>Por entregar</span><b>${Math.max(0,totalTasks-submitted)}</b></div><div class="legend-line"><span>Total asignado</span><b>${totalTasks}</b></div></div></div><div class="visual-note">Recuento orientativo de entregas registradas en este navegador.</div></section></div><div class="two"><section class="card"><h2 class="section-title">Tus aulas</h2><div class="progress-list">${COURSES.map((c,i)=>{let n=data.students.filter(s=>s.course===c).length;let pct=data.students.length?Math.round(n/data.students.length*100):0;return `<div><div class="progress-top"><b>${c}</b><span class="muted">${n} alumno(s)</span></div><div class="progress-track"><div class="progress-fill ${i?'green':''}" style="--w:${pct}%"></div></div></div>`}).join('')}</div></section><section class="card"><h2 class="section-title">Últimas calificaciones</h2>${data.grades.slice(0,5).map(g=>`<div class="item"><div><b>${esc(g.student)}</b><div class="muted small">${esc(g.subject)} · ${esc(g.title)}</div></div><b class="score ${g.mark>=5?'good':'bad'}">${g.mark}/10</b></div>`).join('')||'<div class="empty">Aún no hay notas. Puedes añadirlas desde Calificaciones.</div>'}</section></div><div class="notice">Consejo de privacidad: utiliza alias (por ejemplo, Alumno 1) y evita introducir apellidos, direcciones, teléfonos u otros datos personales de menores.</div>`}

function classroomsPage(){return `<div class="grid">${COURSES.map(c=>cardMetric(c,data.students.filter(s=>s.course===c).length+' alumnos','Aula activa')).join('')}</div><section class="card"><h2 class="section-title">Espacios de clase</h2><div class="two">${COURSES.map(c=>`<div class="item"><div><b>${c}</b><div class="muted small">${SUBJECTS[c].join(' · ')}</div></div><span class="tag">${data.students.filter(s=>s.course===c).length} alumnos</span></div>`).join('')}</div><p class="muted small">Los cursos se gestionan localmente en esta versión. Más adelante añadiremos los códigos de acceso reales y la sincronización.</p></section>`}
function tasksPage(){return `<div class="two"><section class="card"><h2 class="section-title">Crear tarea</h2><div class="field"><label>Título</label><input id="taskTitle" placeholder="Ej. Repasar las tablas"></div><div class="field"><label>Instrucciones</label><textarea id="taskDesc" placeholder="Explica qué tiene que hacer el alumno"></textarea></div><div class="field"><label>Curso</label>${courseSelect('taskCourse')}</div><div class="field"><label>Fecha de entrega</label><input id="taskDate" type="date"></div><button id="addTask">Publicar tarea</button></section><section class="card"><h2 class="section-title">Tareas publicadas</h2>${data.tasks.map(t=>{let done=data.studentSubmissions.filter(x=>x.taskId==t.id);return `<div class="item"><div><b>${esc(t.title)}</b><div class="muted small">${t.course} · Entrega: ${t.date||'Sin fecha'} · ${esc(t.desc)}</div><span class="tag">${done.length} entrega(s) registrada(s)</span></div><button class="danger" data-deltask="${t.id}">Eliminar</button></div>`}).join('')||'<div class="empty">Todavía no has publicado tareas.</div>'}</section></div><section class="card"><h2 class="section-title">Entregas del alumnado</h2>${data.studentSubmissions.map(x=>`<div class="item"><div><b>${esc(x.student)}</b><div class="muted small">${esc(x.taskTitle)} · ${esc(x.course)}</div><div class="muted small">${esc(x.answer||'Marcada como completada')}</div></div><span class="tag">${esc(x.status)}</span></div>`).join('')||'<div class="empty">Cuando un alumno marque una tarea como terminada desde la vista de alumnado, aparecerá aquí en este navegador.</div>'}</section><div class="notice">Las entregas de esta versión se guardan en este navegador. Para que los alumnos puedan entrar desde sus propios dispositivos y enviar trabajos desde casa, tendremos que conectar un servidor y una base de datos.</div>`}
function libraryPage(){return `<div class="two"><section class="card"><h2 class="section-title">Añadir recurso</h2><div class="field"><label>Nombre del recurso</label><input id="resTitle" placeholder="Ej. Vídeo de fracciones"></div><div class="field"><label>Enlace (opcional)</label><input id="resUrl" type="url" placeholder="https://..."></div><div class="field"><label>Curso</label>${courseSelect('resCourse')}</div><div class="field"><label>Descripción</label><textarea id="resDesc" placeholder="¿Para qué sirve este material?"></textarea></div><button id="addResource">Guardar recurso</button></section><section class="card"><h2 class="section-title">Biblioteca de recursos</h2>${data.resources.map(r=>`<div class="item"><div><b>${esc(r.title)}</b><div class="muted small">${r.course} · ${esc(r.desc||'')}</div>${r.url?`<a href="${esc(r.url)}" target="_blank" rel="noopener">Abrir recurso ↗</a>`:''}</div><button class="danger" data-delresource="${r.id}">Eliminar</button></div>`).join('')||'<div class="empty">Tu biblioteca está vacía. Añade el primer recurso.</div>'}</section></div>`}

function studentsPage(){return `<div class="two"><section class="card"><h2 class="section-title">Añadir alumno</h2><div class="field"><label>Nombre o alias</label><input id="sname" placeholder="Ej. Alumno 3"></div><div class="field"><label>Curso</label>${courseSelect()}</div><div class="field"><label>Grupo</label><input id="sgroup" value="A"></div><button id="addStudent">Añadir alumno</button></section><section class="card"><h2 class="section-title">Alumnos registrados</h2><div class="list">${data.students.map(s=>`<div class="item"><div><b>${esc(s.name)}</b><div class="muted small">${s.course} · Grupo ${esc(s.group||'—')}</div></div><button class="danger" data-delstudent="${s.id}">Eliminar</button></div>`).join('')||'<div class="empty">No hay alumnos.</div>'}</div></section></div><section class="card"><h2 class="section-title">Ficha de alumno</h2><div class="field"><label>Selecciona alumno</label><select id="profileStudent">${data.students.map(s=>`<option value="${s.id}">${esc(s.name)} · ${s.course}</option>`).join('')}</select></div><div id="profile"></div></section>`}
function profileRender(){let s=data.students.find(x=>x.id==$('#profileStudent')?.value)||data.students[0];let p=$('#profile');if(!p||!s){if(p)p.innerHTML='<div class="empty">Añade un alumno para ver su ficha.</div>';return}let gs=data.grades.filter(g=>g.student===s.name&&g.course===s.course);let mean=gs.length?(gs.reduce((a,g)=>a+g.mark,0)/gs.length).toFixed(2):'—';let obs=data.observations.filter(o=>o.student===s.name&&o.course===s.course);p.innerHTML=`<div class="grid">${cardMetric('Notas',gs.length,'Registradas')}${cardMetric('Media',mean,'Sobre 10')}</div><h3>Historial</h3>${gs.map(g=>`<div class="item"><span>${esc(g.subject)} · ${esc(g.title)}</span><b class="score ${g.mark>=5?'good':'bad'}">${g.mark}/10</b></div>`).join('')||'<div class="empty">Sin calificaciones todavía.</div>'}<h3>Observaciones</h3><textarea id="obsText" placeholder="Anota observaciones educativas, sin datos sensibles..."></textarea><button id="addObs">Guardar observación</button>${obs.map(o=>`<p class="item">${esc(o.text)}</p>`).join('')}`}
function gradesPage(){return `<div class="two"><section class="card"><h2 class="section-title">Registrar nota</h2><div class="field"><label>Alumno</label><select id="gstudent">${data.students.map(s=>`<option>${esc(s.name)}|${s.course}</option>`).join('')}</select></div><div class="field"><label>Asignatura</label><select id="gsubject"></select></div><div class="field"><label>Actividad o examen</label><input id="gtitle" placeholder="Ej. Control del tema 2"></div><div class="field"><label>Nota sobre 10</label><input id="gmark" type="number" min="0" max="10" step="0.1" placeholder="8"></div><button id="addGrade">Guardar calificación</button></section><section class="card"><h2 class="section-title">Resumen</h2>${COURSES.map(c=>{let a=data.grades.filter(g=>g.course===c);return `<div class="item"><div><b>${c}</b><div class="muted small">${a.length} nota(s)</div></div><b>${a.length?(a.reduce((x,g)=>x+g.mark,0)/a.length).toFixed(2)+'/10':'—'}</b></div>`}).join('')}</section></div><section class="card"><h2 class="section-title">Todas las calificaciones</h2><div class="tablewrap"><table><thead><tr><th>Alumno</th><th>Curso</th><th>Asignatura</th><th>Actividad</th><th>Nota</th><th></th></tr></thead><tbody>${data.grades.map(g=>`<tr><td>${esc(g.student)}</td><td>${g.course}</td><td>${esc(g.subject)}</td><td>${esc(g.title)}</td><td><b>${g.mark}/10</b></td><td><button class="danger" data-delgrade="${g.id}">Borrar</button></td></tr>`).join('')||'<tr><td colspan="6">Todavía no hay notas.</td></tr>'}</tbody></table></div></section>`}
function activitiesPage(){return `<div class="two"><section class="card"><h2 class="section-title">Crear cuestionario</h2><div class="field"><label>Nombre</label><input id="qtitle" placeholder="Repaso del tema 1"></div><div class="field"><label>Curso</label>${courseSelect('qcourse')}</div><div class="field"><label>Asignatura</label><select id="qsubject"></select></div><div id="questionEditor"><div class="qbox"><div class="field"><label>Pregunta</label><input id="question" placeholder="¿Cuánto es 2 + 2?"></div><div class="field"><label>Opción A</label><input id="qa" placeholder="3"></div><div class="field"><label>Opción B</label><input id="qb" placeholder="4"></div><div class="field"><label>Opción C</label><input id="qc" placeholder="5"></div><div class="field"><label>Respuesta correcta</label><select id="qcorrect"><option>A</option><option selected>B</option><option>C</option></select></div><button class="secondary" id="addQuestion">Añadir pregunta</button></div></div><div id="qDraft" class="muted small">0 preguntas añadidas</div><button id="saveQuiz">Guardar cuestionario</button></section><section class="card"><h2 class="section-title">Tus cuestionarios</h2>${data.activities.map(a=>`<div class="item"><div><b>${esc(a.title)}</b><div class="muted small">${a.course} · ${esc(a.subject)} · ${a.questions.length} preguntas</div></div><button data-take="${a.id}">Realizar</button></div>`).join('')||'<div class="empty">Todavía no has creado actividades.</div>'}</section></div><section class="card hidden" id="takeCard"><h2 class="section-title" id="takeTitle">Realizar actividad</h2><div class="field"><label>Alumno</label><select id="takeStudent"></select></div><div id="takeQuestions"></div><button id="correctQuiz">Corregir y guardar nota</button><div id="quizResult"></div></section>`}
function groupsPage(){return `<div class="two"><section class="card"><h2 class="section-title">Crear grupo</h2><div class="field"><label>Nombre del grupo</label><input id="groupName" placeholder="Ej. Grupo de lectura"></div><div class="field"><label>Curso</label>${courseSelect('groupCourse')}</div><div class="field"><label>Alumnos (puedes escribir alias separados por comas)</label><textarea id="groupMembers" placeholder="Alumno 1, Alumno 2"></textarea></div><button id="addGroup">Crear grupo</button></section><section class="card"><h2 class="section-title">Grupos existentes</h2>${data.groups.map(g=>`<div class="item"><div><b>${esc(g.name)}</b><div class="muted small">${g.course} · ${esc(g.members)}</div></div><button class="danger" data-delgroup="${g.id}">Eliminar</button></div>`).join('')||'<div class="empty">No hay grupos creados.</div>'}</section></div>`}
function calendarPage(){return `<div class="two"><section class="card"><h2 class="section-title">Añadir evento</h2><div class="field"><label>Nombre</label><input id="eventName" placeholder="Ej. Examen de Matemáticas"></div><div class="field"><label>Fecha</label><input id="eventDate" type="date"></div><div class="field"><label>Curso</label>${courseSelect('eventCourse')}</div><button id="addEvent">Añadir al calendario</button></section><section class="card"><h2 class="section-title">Próximos eventos</h2>${[...data.events].sort((a,b)=>a.date.localeCompare(b.date)).map(e=>`<div class="item"><div><b>${esc(e.name)}</b><div class="muted small">${e.date} · ${e.course}</div></div><button class="danger" data-delevent="${e.id}">Eliminar</button></div>`).join('')||'<div class="empty">No hay eventos planificados.</div>'}</section></div>`}
function reportsPage(){return `<section class="card"><div class="row between"><h2 class="section-title">Informe de evaluación</h2><button class="no-print" onclick="window.print()">Imprimir / Guardar PDF</button></div><div class="field"><label>Curso</label>${courseSelect('reportCourse')}</div><div id="reportTable"></div></section>`}
function settingsPage(){return `<section class="card"><h2 class="section-title">Importar alumnos desde Excel</h2><p class="muted">Selecciona tu archivo RODRI EDUCA. Se leerá la hoja “Alumnos” y se actualizará la lista de alumnos de esta web.</p><div class="field"><label>Archivo Excel (.xlsx)</label><input type="file" id="excelFile" accept=".xlsx,.xls"></div><button id="importExcel">Importar alumnos</button><p class="muted small">La lectura se hace en tu navegador. El archivo no se envía a GitHub ni se publica. La importación reemplaza la lista actual de alumnos; las notas existentes no se borran.</p></section><section class="card"><h2 class="section-title">Copia de seguridad</h2><p class="muted">Descarga todos tus alumnos, notas, actividades, grupos, observaciones y eventos en un archivo JSON.</p><button id="backup">Descargar copia de seguridad</button><div class="field"><label>Restaurar una copia JSON</label><input type="file" id="restoreFile" accept="application/json"></div><button class="secondary" id="restore">Restaurar datos</button></section><section class="card"><h2 class="section-title">Privacidad y funcionamiento</h2><p>Esta versión guarda los datos únicamente en el almacenamiento local de este navegador. No hay cuentas, sincronización entre dispositivos ni servidor conectado. Los códigos de clase y las entregas multiusuario todavía no están activos.</p><p>Usa alias y no introduzcas información personal sensible de menores. Si borras los datos del navegador, puedes perder la información; descarga copias de seguridad periódicamente.</p><button class="danger" id="reset">Restablecer plataforma</button></section>`}
function studentPage(){const valid=data.students;const selected=valid.find(x=>String(x.id)===String(window.activeStudentId))||valid[0];if(!selected)return `<div class="empty">Todavía no hay alumnos registrados. Vuelve a la zona del profesor y añade un alumno con un alias.</div>`;window.activeStudentId=selected.id;const tasks=data.tasks.filter(t=>t.course===selected.course),resources=data.resources.filter(r=>r.course===selected.course),quizzes=data.activities.filter(a=>a.course===selected.course),grades=data.grades.filter(g=>g.student===selected.name&&g.course===selected.course);return `<div class="student-hero"><div class="student-welcome-art"><div class="big-illustration">📚</div><div class="row between" style="flex:1"><div><h2>¡Hola, ${esc(selected.name)}! 👋</h2><div class="muted">Este es tu espacio de ${esc(selected.course)}. ¡Vamos a aprender!</div></div><span class="tag">${esc(selected.course)}</span></div></div><div class="field" style="max-width:320px;margin-bottom:0"><label>Estoy trabajando como…</label><select id="studentPicker">${valid.map(x=>`<option value="${esc(x.id)}" ${String(x.id)===String(selected.id)?'selected':''}>${esc(x.name)} · ${esc(x.course)}</option>`).join('')}</select></div></div><div class="student-grid"><div class="student-tile"><div class="muted small">Mis tareas</div><div class="metric">${tasks.length}</div><div class="muted small">${tasks.filter(t=>data.studentSubmissions.some(x=>x.taskId==t.id&&x.student===selected.name)).length} completadas</div></div><div class="student-tile"><div class="muted small">Actividades</div><div class="metric">${quizzes.length}</div><div class="muted small">Cuestionarios disponibles</div></div><div class="student-tile"><div class="muted small">Mis notas</div><div class="metric">${grades.length}</div><div class="muted small">Resultados registrados</div></div></div><section class="visual-card" style="margin-top:16px"><div class="visual-head"><h2>Mi progreso</h2><span class="illustration mint">🌱</span></div><div class="progress-top"><b>Tareas entregadas</b><span class="muted">${tasks.filter(t=>data.studentSubmissions.some(x=>x.taskId==t.id&&x.student===selected.name)).length} de ${tasks.length}</span></div><div class="progress-track"><div class="progress-fill green" style="--w:${tasks.length?Math.round(tasks.filter(t=>data.studentSubmissions.some(x=>x.taskId==t.id&&x.student===selected.name)).length/tasks.length*100):0}%"></div></div><div class="visual-note">Cada tarea que completas hace crecer tu progreso.</div></section><section class="card" style="margin-top:16px"><h2 class="section-title">📚 Mis tareas</h2>${tasks.map(t=>{let done=data.studentSubmissions.some(x=>x.taskId==t.id&&x.student===selected.name);return `<div class="item"><div><b>${esc(t.title)}</b><div class="muted small">${esc(t.desc||'Sigue las indicaciones de tu profesor')} · Entrega: ${t.date||'Sin fecha'}</div><span class="tag">${done?'Entregada':'Pendiente'}</span>${!done?`<div class="field" style="min-width:230px"><label>Tu respuesta</label><textarea id="taskAnswer${t.id}" placeholder="Escribe aquí lo que has hecho..."></textarea></div>`:`<div class="muted small">Respuesta: ${esc(data.studentSubmissions.find(x=>x.taskId==t.id&&x.student===selected.name)?.answer||'Entregada')}</div>`}</div>${done?'<span class="tag">✓ Entregada</span>':`<button data-submit-task="${t.id}">Entregar tarea</button>`}</div>`}).join('')||'<div class="empty">¡De momento no tienes tareas pendientes!</div>'}</section><section class="card"><h2 class="section-title">✏️ Actividades para practicar</h2>${quizzes.map(a=>`<div class="item"><div><b>${esc(a.title)}</b><div class="muted small">${esc(a.subject)} · ${a.questions.length} preguntas</div></div><button data-student-quiz="${a.id}">Empezar</button></div>`).join('')||'<div class="empty">Todavía no hay actividades disponibles para tu curso.</div>'}<div id="studentQuizArea"></div></section><section class="card"><h2 class="section-title">📖 Mi biblioteca</h2>${resources.map(r=>`<div class="item"><div><b>${esc(r.title)}</b><div class="muted small">${esc(r.desc||'Material de clase')}</div>${r.url?`<a href="${esc(r.url)}" target="_blank" rel="noopener">Abrir material ↗</a>`:''}</div></div>`).join('')||'<div class="empty">Tu profesor todavía no ha añadido materiales.</div>'}</section><section class="card"><h2 class="section-title">⭐ Mis resultados</h2>${grades.map(g=>`<div class="item"><div><b>${esc(g.title)}</b><div class="muted small">${esc(g.subject)}</div></div><b class="score ${g.mark>=5?'good':'bad'}">${g.mark}/10</b></div>`).join('')||'<div class="empty">Cuando realices una actividad, tus resultados aparecerán aquí.</div>'}</section><div class="notice">Esta es una demostración de la zona del alumnado en el mismo navegador. Todavía no es un acceso privado: todos los datos se guardan localmente. Más adelante añadiremos códigos de clase y acceso desde otros dispositivos.</div>`}
function wireStudent(){const picker=$('#studentPicker');if(picker)picker.onchange=()=>{window.activeStudentId=picker.value;studentQuizId=null;render()};document.querySelectorAll('[data-submit-task]').forEach(b=>b.onclick=()=>{const task=data.tasks.find(t=>t.id==b.dataset.submitTask),student=data.students.find(x=>String(x.id)===String(window.activeStudentId));if(!task||!student)return;data.studentSubmissions.push({id:Date.now(),taskId:task.id,taskTitle:task.title,student:student.name,course:student.course,status:'Completada',answer:($('#taskAnswer'+task.id)?.value||'Tarea marcada como hecha').trim()});save();render()});document.querySelectorAll('[data-student-quiz]').forEach(b=>b.onclick=()=>{studentQuizId=Number(b.dataset.studentQuiz);const a=data.activities.find(x=>x.id===studentQuizId);if(!a)return;const area=$('#studentQuizArea');area.innerHTML=`<div class="qbox"><h3>${esc(a.title)}</h3>${a.questions.map((q,i)=>`<div class="qbox"><b>${i+1}. ${esc(q.q)}</b>${['A','B','C'].map(k=>`<label class="checkline"><input type="radio" name="studentAns${i}" value="${k}"> ${k}) ${esc(q[k.toLowerCase()])}</label>`).join('')}</div>`).join('')}<button id="sendStudentQuiz">Entregar actividad</button><div id="studentQuizResult"></div></div>`;$('#sendStudentQuiz').onclick=()=>{let correct=0,answered=true;a.questions.forEach((q,i)=>{const chosen=document.querySelector(`input[name="studentAns${i}"]:checked`);if(!chosen)answered=false;else if(chosen.value===q.correct)correct++});if(!answered)return alert('Contesta todas las preguntas antes de entregar.');const student=data.students.find(x=>String(x.id)===String(window.activeStudentId));const mark=Math.round(correct/a.questions.length*100)/10;data.grades.unshift({id:Date.now(),student:student.name,course:student.course,subject:a.subject,title:a.title,mark});save();$('#studentQuizResult').innerHTML=`<div class="notice">Has acertado ${correct} de ${a.questions.length}. Tu resultado es ${mark}/10.</div>`;document.querySelectorAll('#sendStudentQuiz').forEach(x=>x.disabled=true)}})}

function wire(){if(page==='tasks'){if($('#addTask'))$('#addTask').onclick=()=>{let title=$('#taskTitle').value.trim();if(!title)return alert('Escribe un título para la tarea.');data.tasks.unshift({id:Date.now(),title,desc:$('#taskDesc').value.trim(),course:$('#taskCourse').value,date:$('#taskDate').value,status:'Pendiente'});save();render()};document.querySelectorAll('[data-deltask]').forEach(b=>b.onclick=()=>{data.tasks=data.tasks.filter(t=>t.id!=b.dataset.deltask);save();render()})}if(page==='library'){if($('#addResource'))$('#addResource').onclick=()=>{let title=$('#resTitle').value.trim(),url=$('#resUrl').value.trim();if(!title)return alert('Escribe el nombre del recurso.');if(url&&!/^https?:\/\//i.test(url))return alert('El enlace debe empezar por https:// o http://');data.resources.unshift({id:Date.now(),title,url,course:$('#resCourse').value,desc:$('#resDesc').value.trim()});save();render()};document.querySelectorAll('[data-delresource]').forEach(b=>b.onclick=()=>{data.resources=data.resources.filter(r=>r.id!=b.dataset.delresource);save();render()})}if(page==='students'){if($('#addStudent'))$('#addStudent').onclick=()=>{let name=$('#sname').value.trim();if(!name)return;data.students.push({id:Date.now(),name,course:$('#course').value,group:$('#sgroup').value.trim()});save();render()};document.querySelectorAll('[data-delstudent]').forEach(b=>b.onclick=()=>{if(confirm('¿Eliminar este alumno?')){data.students=data.students.filter(s=>s.id!=b.dataset.delstudent);save();render()}});if($('#profileStudent')){$('#profileStudent').onchange=profileRender;profileRender()}if($('#addObs'))$('#addObs').onclick=()=>{let s=data.students.find(x=>x.id==$('#profileStudent').value),t=$('#obsText').value.trim();if(s&&t){data.observations.push({id:Date.now(),student:s.name,course:s.course,text:t});save();profileRender()}}}
if(page==='grades'){const update=()=>{let c=$('#gstudent').value.split('|')[1];$('#gsubject').innerHTML=SUBJECTS[c].map(s=>`<option>${s}</option>`).join('')};if($('#gstudent')){$('#gstudent').onchange=update;update()}if($('#addGrade'))$('#addGrade').onclick=()=>{let [student,course]=$('#gstudent').value.split('|'),mark=Number($('#gmark').value);if(!$('#gtitle').value.trim()||$('#gmark').value===''||mark<0||mark>10||!Number.isFinite(mark))return alert('Completa la actividad y una nota válida de 0 a 10.');data.grades.unshift({id:Date.now(),student,course,subject:$('#gsubject').value,title:$('#gtitle').value.trim(),mark});save();render()};document.querySelectorAll('[data-delgrade]').forEach(b=>b.onclick=()=>{data.grades=data.grades.filter(g=>g.id!=b.dataset.delgrade);save();render()})}
if(page==='activities'){let update=()=>{$('#qsubject').innerHTML=SUBJECTS[$('#qcourse').value].map(s=>`<option>${s}</option>`).join('')};$('#qcourse').onchange=update;update();$('#addQuestion').onclick=()=>{let q=$('#question').value.trim(),a=$('#qa').value.trim(),b=$('#qb').value.trim(),c=$('#qc').value.trim();if(!q||!a||!b||!c)return alert('Completa el enunciado y las tres opciones.');draft.push({q,a,b,c,correct:$('#qcorrect').value});$('#qDraft').textContent=draft.length+' pregunta(s) añadida(s)';['question','qa','qb','qc'].forEach(id=>$('#'+id).value='')};$('#saveQuiz').onclick=()=>{if(!$('#qtitle').value.trim()||!draft.length)return alert('Pon un nombre y añade al menos una pregunta.');data.activities.unshift({id:Date.now(),title:$('#qtitle').value.trim(),course:$('#qcourse').value,subject:$('#qsubject').value,questions:draft});draft=[];save();render()};document.querySelectorAll('[data-take]').forEach(b=>b.onclick=()=>{currentQuiz=data.activities.find(a=>a.id==b.dataset.take);$('#takeCard').classList.remove('hidden');$('#takeTitle').textContent=currentQuiz.title;$('#takeStudent').innerHTML=data.students.filter(s=>s.course===currentQuiz.course).map(s=>`<option>${esc(s.name)}</option>`).join('');$('#takeQuestions').innerHTML=currentQuiz.questions.map((q,i)=>`<div class="qbox"><b>${i+1}. ${esc(q.q)}</b>${['A','B','C'].map(k=>`<label class="checkline"><input type="radio" name="ans${i}" value="${k}"> ${k}) ${esc(q[k.toLowerCase()])}</label>`).join('')}</div>`).join('');$('#quizResult').innerHTML='';$('#correctQuiz').onclick=()=>{let correct=0,answered=true;currentQuiz.questions.forEach((q,i)=>{let x=document.querySelector(`input[name="ans${i}"]:checked`);if(!x)answered=false;else if(x.value===q.correct)correct++});if(!answered)return alert('Contesta todas las preguntas antes de corregir.');let student=$('#takeStudent').value,mark=Math.round(correct/currentQuiz.questions.length*100)/10;data.grades.unshift({id:Date.now(),student,course:currentQuiz.course,subject:currentQuiz.subject,title:currentQuiz.title,mark});save();$('#quizResult').innerHTML=`<div class="notice">Resultado: ${correct}/${currentQuiz.questions.length} · Nota: <b>${mark}/10</b>. Se ha añadido al cuaderno de calificaciones.</div>`}})}
if(page==='groups'){ $('#addGroup').onclick=()=>{let name=$('#groupName').value.trim();if(!name)return;data.groups.push({id:Date.now(),name,course:$('#groupCourse').value,members:$('#groupMembers').value.trim()});save();render()};document.querySelectorAll('[data-delgroup]').forEach(b=>b.onclick=()=>{data.groups=data.groups.filter(g=>g.id!=b.dataset.delgroup);save();render()})}
if(page==='calendar'){$('#addEvent').onclick=()=>{if(!$('#eventName').value.trim()||!$('#eventDate').value)return alert('Indica nombre y fecha.');data.events.push({id:Date.now(),name:$('#eventName').value.trim(),date:$('#eventDate').value,course:$('#eventCourse').value});save();render()};document.querySelectorAll('[data-delevent]').forEach(b=>b.onclick=()=>{data.events=data.events.filter(e=>e.id!=b.dataset.delevent);save();render()})}
if(page==='reports'){let update=()=>{let c=$('#reportCourse').value,students=data.students.filter(s=>s.course===c);$('#reportTable').innerHTML=`<h3>${c}</h3><div class="tablewrap"><table><thead><tr><th>Alumno</th>${SUBJECTS[c].map(s=>`<th>${s}</th>`).join('')}<th>Media</th></tr></thead><tbody>${students.map(s=>{let gs=data.grades.filter(g=>g.student===s.name&&g.course===c),avg=gs.length?(gs.reduce((a,g)=>a+g.mark,0)/gs.length).toFixed(2):'—';return `<tr><td>${esc(s.name)}</td>${SUBJECTS[c].map(sub=>{let a=gs.filter(g=>g.subject===sub);return `<td>${a.length?(a.reduce((x,g)=>x+g.mark,0)/a.length).toFixed(1):'—'}</td>`}).join('')}<td><b>${avg}</b></td></tr>`}).join('')}</tbody></table></div>`};$('#reportCourse').onchange=update;update()}
if(page==='settings'){$('#importExcel').onclick=()=>{const f=$('#excelFile').files[0];if(!f)return alert('Selecciona primero tu archivo Excel.');if(typeof XLSX==='undefined')return alert('No se ha podido cargar el lector de Excel. Comprueba tu conexión a Internet y vuelve a intentarlo.');const reader=new FileReader();reader.onload=e=>{try{const book=XLSX.read(e.target.result,{type:'array'});const sheet=book.Sheets['Alumnos'];if(!sheet)throw new Error('No encuentro la hoja Alumnos.');const rows=XLSX.utils.sheet_to_json(sheet,{header:1,defval:''});const imported=rows.slice(3).filter(r=>String(r[3]||'').trim()).map((r,i)=>({id:String(r[0]||('imp'+Date.now()+i)),name:String(r[3]).trim(),course:String(r[2]||'').trim(),group:String(r[1]||'').trim()}));if(!imported.length)throw new Error('No he encontrado alumnos en la hoja Alumnos.');const invalid=imported.filter(x=>!COURSES.includes(x.course));if(invalid.length)throw new Error('Hay cursos que no reconozco en la hoja Alumnos. Revisa la columna Curso.');if(!confirm('Voy a sustituir la lista actual por '+imported.length+' alumno(s) del Excel. Las notas, actividades y demás datos no se borrarán. ¿Continuar?'))return;data.students=imported;save();render();alert('¡Importación completada! Ya aparecen los alumnos del Excel.');}catch(err){alert('No se pudo importar: '+err.message)}};reader.readAsArrayBuffer(f)};$('#backup').onclick=()=>{let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='rodrI_educa_copia.json';a.click();URL.revokeObjectURL(a.href)};$('#restore').onclick=()=>{let f=$('#restoreFile').files[0];if(!f)return alert('Selecciona primero un archivo JSON.');let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!d.students||!d.grades||!d.activities)throw 0;data={...defaults,...d};save();render();alert('Copia restaurada.')}catch(e){alert('El archivo no parece una copia válida de RODRI EDUCA.')}};r.readAsText(f)};$('#reset').onclick=()=>{if(confirm('¿Seguro? Se borrarán los datos locales. Descarga antes una copia si la necesitas.')){data=structuredClone(defaults);save();render()}}}}
